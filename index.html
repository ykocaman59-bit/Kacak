<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanal Panel Kontrolü</title>
    <style>
        /* Genel Temizleme ve Karanlık Tema Ayarları */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f111a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Üst Bar (Header) */
        header {
            background-color: #161925;
            padding: 15px 20px;
            border-bottom: 2px solid #23283d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 20px;
            color: #00ffcc;
            letter-spacing: 1px;
        }

        .status-badge {
            background-color: #10b981;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        /* Ana Kolonlu Yapı (Grid Sistemi) */
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px;
            flex: 1;
        }

        /* Kart ve Kolon Tasarımları */
        .column-card {
            background-color: #161925;
            border: 1px solid #23283d;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        .column-card h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #f3f4f6;
            border-bottom: 1px solid #23283d;
            padding-bottom: 8px;
        }

        /* Form Elemanları ve Butonlar */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 6px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            background-color: #1f2335;
            border: 1px solid #23283d;
            border-radius: 6px;
            color: white;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #00ffcc;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #00ffcc;
            color: #0f111a;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            margin-top: auto; /* Butonu hep en alta sabitlemek için */
        }

        .btn:hover {
            background-color: #00d4aa;
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Konsol / Çıktı Ekranı */
        .console-box {
            background-color: #090a0f;
            border: 1px solid #1f2335;
            border-radius: 6px;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            color: #00ffcc;
            height: 180px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        /* Alt Bilgi (Footer) */
        footer {
            text-align: center;
            padding: 15px;
            font-size: 12px;
            color: #4b5563;
            background-color: #090a0f;
            border-top: 1px solid #161925;
        }
    </style>
</head>
<body>

    <header>
        <h1>NITROGEN PANEL v1.0</h1>
        <div class="status-badge">Sistem Aktif</div>
    </header>

    <div class="container">
        <!-- 1. KOLON: Yapılandırma Girişleri -->
        <div class="column-card">
            <h2>⚙️ Sunucu Ayarları</h2>
            <div class="form-group">
                <label for="serverIp">Sunucu IP Adresi / URL</label>
                <input type="text" id="serverIp" placeholder="Örn: 192.168.1.100 veya api.site.com">
            </div>
            <div class="form-group">
                <label for="authKey">Kimlik Doğrulama Anahtarı (API Key)</label>
                <input type="password" id="authKey" placeholder="••••••••••••••••">
            </div>
            <div class="form-group">
                <label for="requestMode">İşlem Modu</label>
                <select id="requestMode">
                    <option value="get">Veri Oku (GET)</option>
                    <option value="post">Veri Gönder (POST)</option>
                    <option value="sync">Senkronize Et</option>
                </select>
            </div>
        </div>

        <!-- 2. KOLON: Tetikleme ve Operasyon -->
        <div class="column-card">
            <h2>🚀 Operasyon Yönetimi</h2>
            <div class="form-group">
                <label for="targetPayload">Gönderilecek Veri (JSON/Metin)</label>
                <input type="text" id="targetPayload" placeholder='Örn: {"status": "update"}'>
            </div>
            <div class="form-group">
                <label for="intervalSpeed">İşlem Hızı (Milisaniye)</label>
                <input type="number" id="intervalSpeed" value="1000" min="100">
            </div>
            <button class="btn" id="startBtn" onclick="calistir()">İŞLEMİ BAŞLAT</button>
        </div>

        <!-- 3. KOLON: Canlı Konsol Çıktısı -->
        <div class="column-card">
            <h2>🖥️ Canlı Konsol Takibi</h2>
            <div class="console-box" id="consoleOutput">[Sistem] Başlatılmaya hazır. Verileri girip butona basın...</div>
        </div>
    </div>

    <footer>
        &copy; 2026 Nitrogen Web Panel. Tüm hakları saklıdır. GitHub Pages üzerinde çalışmak üzere optimize edilmiştir.
    </footer>

    <script>
        // Basit Konsol Log Simülasyonu
        function logYaz(mesaj) {
            const consoleBox = document.getElementById('consoleOutput');
            const zaman = new Date().toLocaleTimeString();
            consoleBox.innerHTML += `\n[${zaman}] ${mesaj}`;
            consoleBox.scrollTop = consoleBox.scrollHeight; // Otomatik aşağı kaydır
        }

        function calistir() {
            const ip = document.getElementById('serverIp').value;
            const mod = document.getElementById('requestMode').value;
            const buton = document.getElementById('startBtn');

            if(!ip) {
                logYaz("⚠️ HATA: Lütfen geçerli bir IP veya URL adresi girin!");
                return;
            }

            logYaz(`🔄 Bağlantı kuruluyor: ${ip}...`);
            logYaz(`ℹ️ Mod ayarlandı: ${mod.toUpperCase()}`);
            
            // Küçük bir görsel geri bildirim
            buton.innerHTML = "İŞLEM YAPILIYOR...";
            buton.style.backgroundColor = "#eab308";
            
            setTimeout(() => {
                logYaz("✅ İşlem başarıyla tamamlandı!");
                buton.innerHTML = "İŞLEMİ BAŞLAT";
                buton.style.backgroundColor = "#00ffcc";
            }, 1500);
        }
    </script>
</body>
</html>
