<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nitrogen PDA - Klasik</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #2c6ae5; /* Orijinal arka plan mavi rengi */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Mobil Ekran Çerçevesi */
        .pda-screen {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background-color: #2c6ae5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            position: relative;
        }

        /* Beyaz Form Kartı (Giriş Ekranı) */
        .login-card {
            background-color: #ffffff;
            width: 100%;
            border-radius: 4px;
            padding: 30px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* Logo Alanı */
        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .logo-container img {
            height: 55px;
        }

        /* Giriş Alanları (Klasik Çizgili Stil) */
        .classic-input {
            width: 100%;
            border: none;
            border-bottom: 1px dashed #babcbe;
            padding: 8px 0;
            font-size: 15px;
            outline: none;
            color: #555;
        }

        .classic-input::placeholder {
            color: #babcbe;
        }

        /* Firma Seçimi Dropdown */
        .classic-select {
            width: 100%;
            height: 40px;
            background-color: #eeeeee;
            border: none;
            border-radius: 4px;
            padding: 0 10px;
            color: #777;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        /* Beni Hatırla & İşlemler Satırı */
        .row-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #999;
        }

        .remember-checkbox {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .remember-checkbox input {
            width: 16px;
            height: 16px;
            accent-color: #4a86e8;
        }

        .dropdown-actions {
            color: #666;
            cursor: pointer;
        }

        /* Butonlar Satırı */
        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 5px;
        }

        .btn-classic {
            height: 48px;
            border: none;
            border-radius: 24px; /* Oval buton tasarımı */
            font-size: 16px;
            color: white;
            cursor: pointer;
            font-weight: 500;
        }

        .btn-blue {
            background-color: #4a86e8;
        }

        .btn-red {
            background-color: #e05e55;
        }

        /* Offline / Online Switch */
        .switch-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #999;
            margin: 5px 0;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #4a86e8;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #cbd5e1;
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        /* Alt Linkler */
        .web-link {
            text-align: center;
            color: #4a86e8;
            text-decoration: none;
            font-size: 13px;
        }

        .copyright {
            text-align: center;
            color: #666;
            font-size: 12px;
        }

        /* --- SAYFA YAPILARI (İÇ EKRANLAR) --- */
        .page {
            display: none;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            padding: 20px;
            flex-direction: column;
        }

        .page.active {
            display: flex;
        }

        /* Menü Ekranı */
        .menu-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            border-bottom: 2px solid #2c6ae5;
            padding-bottom: 8px;
            color: #2c6ae5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu-item {
            background-color: #f3f4f6;
            padding: 15px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-item:hover {
            background-color: #e5e7eb;
        }

        /* Mal Kabul / Tarama Bölümü */
        .scanner-container {
            width: 100%;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
            margin: 15px 0;
        }

        .product-result {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
        }

        .stock-edit-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
        }

        .stock-input {
            width: 80px;
            height: 38px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="pda-screen">
        
        <div id="loginPage" class="login-card" style="display: flex;">
            <div class="logo-container">
                <img src="https://i.imgur.com/gK9wLzG.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/5761/5761421.png'" alt="Nitrogen Logo">
                <div style="font-size: 24px; font-weight: bold; color: #555;">nitrogen <span style="color:#e05e55; font-size:14px; block-size: auto;">PDA</span></div>
            </div>

            <input type="text" id="username" class="classic-input" placeholder="BATTALGAZI">
            <input type="password" id="password" class="classic-input" placeholder="••••••••">

            <select class="classic-select" id="companySelect">
                <option value="">Lütfen Firma Seçimi Yapınız</option>
                <option value="1">Merkez Mağaza / Depo</option>
                <option value="2">Şube 1 Perakende</option>
            </select>

            <div class="row-actions">
                <label class="remember-checkbox">
                    <input type="checkbox" id="remember" checked> Beni Hatırla
                </label>
                <div class="dropdown-actions">İşlemler ▾</div>
            </div>

            <div class="btn-row">
                <button class="btn-classic btn-blue" id="loginBtn">Giriş</button>
                <button class="btn-classic btn-red" onclick="alert('Uygulamadan çıkıldı.')">Çıkış</button>
            </div>

            <div class="switch-container">
                <span>Offline</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="statusMode">
                    <span class="slider"></span>
                </label>
                <span>Online</span>
            </div>

            <a href="http://www.teknoerp.com.tr" target="_blank" class="web-link">www.teknoerp.com.tr</a>
            <div class="copyright">© 2013. Tüm hakları saklıdır.</div>
        </div>


        <div id="menuPage" class="page">
            <div class="menu-title">
                <span>Nitrogen PDA Menü</span>
                <button onclick="logout()" style="background:none; border:none; color:red; cursor:pointer;"><i class="material-icons">logout</i></button>
            </div>
            <div class="menu-list">
                <div class="menu-item" onclick="openPage('malKabulPage')">
                    <i class="material-icons">archive</i> Mal Kabul / Depo Girişi
                </div>
                <div class="menu-item" onclick="openPage('malKabulPage')">
                    <i class="material-icons">search</i> Fiyat Gör / Stok Sorgula
                </div>
                <div class="menu-item">
                    <i class="material-icons">format_list_bulleted</i> Raf Sayım ve Düzenleme
                </div>
            </div>
        </div>


        <div id="malKabulPage" class="page">
            <div class="menu-title">
                <button onclick="openPage('menuPage')" style="background:none; border:none; cursor:pointer;"><i class="material-icons">arrow_back</i></button>
                <span>Mal Kabul / Tarama</span>
                <div></div>
            </div>

            <div class="scanner-container">
                <div id="reader"></div>
            </div>

            <div style="display: flex; gap: 10px;">
                <input type="text" id="manualBarcode" class="classic-input" placeholder="Barkod No Yazın" style="border: 1px solid #ccc; padding: 5px; border-radius: 4px;">
                <button class="btn-classic btn-blue" style="height:35px; width:70px; font-size:14px; border-radius:4px;" onclick="searchManualBarcode()">Ara</button>
            </div>

            <div class="product-result" id="resultBox" style="display: none;">
                <h4 id="resName" style="margin-bottom: 5px; color:#333;">Ürün Adı</h4>
                <p style="font-size:14px; color:#666;">Barkod: <span id="resCode" style="font-weight:bold;">-</span></p>
                <p style="font-size:14px; color:#2c6ae5; font-weight:bold; margin-top:5px;">Mevcut Stok: <span id="resStock">0</span></p>
                
                <div class="stock-edit-row">
                    <input type="number" id="newStockInput" class="stock-input" value="1">
                    <button class="btn-classic btn-blue" style="height:38px; padding:0 15px; font-size:14px; border-radius:4px;" onclick="updateStock()">Stoğu Güncelle</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Örnek Market Stok Listesi
        const marketDatabase = {
            "8690504001234": { name: "Ülker Çikolatalı Gofret 36g", stock: 150 },
            "8690632000156": { name: "Sütaş Ayran 1 Lt", stock: 60 },
            "12345": { name: "Test Keki", stock: 20 }
        };

        let currentScannedBarcode = null;
        let scannerInstance = null;

        // Sayfa Kontrolleri
        function openPage(pageId) {
            document.getElementById('loginPage').style.display = 'none';
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            
            if(pageId === 'loginPage') {
                document.getElementById('loginPage').style.display = 'flex';
                stopScanner();
            } else {
                document.getElementById(pageId).classList.add('active');
            }

            if(pageId === 'malKabulPage') {
                startScanner();
            } else {
                stopScanner();
            }
        }

        // Giriş Yapma
        document.getElementById('loginBtn').addEventListener('click', () => {
            const comp = document.getElementById('companySelect').value;
            if(!comp) {
                alert("Lütfen önce bir firma seçimi yapınız!");
                return;
            }
            openPage('menuPage');
        });

        function logout() {
            openPage('loginPage');
        }

        // Barkod Sorgulama Sonucu
        function handleBarcodeScanned(barcode) {
            currentScannedBarcode = barcode;
            document.getElementById('manualBarcode').value = barcode;
            document.getElementById('resultBox').style.display = 'block';

            if(marketDatabase[barcode]) {
                document.getElementById('resName').textContent = marketDatabase[barcode].name;
                document.getElementById('resCode').textContent = barcode;
                document.getElementById('resStock').textContent = marketDatabase[barcode].stock;
                document.getElementById('newStockInput').value = marketDatabase[barcode].stock;
            } else {
                document.getElementById('resName').textContent = "Yeni / Tanımsız Ürün";
                document.getElementById('resCode').textContent = barcode;
                document.getElementById('resStock').textContent = "0";
                document.getElementById('newStockInput').value = "1";
            }
        }

        function searchManualBarcode() {
            const code = document.getElementById('manualBarcode').value.trim();
            if(code) handleBarcodeScanned(code);
        }

        function updateStock() {
            const val = parseInt(document.getElementById('newStockInput').value) || 0;
            if(!currentScannedBarcode) return;

            if(!marketDatabase[currentScannedBarcode]) {
                marketDatabase[currentScannedBarcode] = { name: "Yeni Ürün", stock: 0 };
            }
            marketDatabase[currentScannedBarcode].stock = val;
            document.getElementById('resStock').textContent = val;
            alert("Stok bilgisi başarıyla güncellendi!");
        }

        // Kamera Kontrolleri
        function startScanner() {
            if(!scannerInstance) {
                scannerInstance = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
                scannerInstance.render((text) => {
                    handleBarcodeScanned(text);
                }, (err) => {});
            }
        }

        function stopScanner() {
            if(scannerInstance) {
                scannerInstance.clear().then(() => { scannerInstance = null; }).catch(e => console.error(e));
            }
        }
    </script>
</body>
</html>
